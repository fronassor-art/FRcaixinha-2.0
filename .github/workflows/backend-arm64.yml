name: Backend ARM64 CI

on:
  push:
  pull_request:

jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frcaixinha_test
          POSTGRES_PASSWORD: frcaixinha_test
          POSTGRES_DB: frcaixinha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frcaixinha_test -d frcaixinha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: sqlite:///./test.db
      JWT_SECRET: testsecret
      APP_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'

      - name: Install PostgreSQL 16 client and pinned age tools
        env:
          GOBIN: ${{ runner.temp }}/age-bin
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          mkdir -p "$GOBIN"
          go install filippo.io/age/cmd/age@v1.2.1
          go install filippo.io/age/cmd/age-keygen@v1.2.1
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Verify native ARM64 runner and Python
        run: |
          uname -m
          python -c 'import platform; machine = platform.machine().lower(); print(machine); assert machine in {"aarch64", "arm64"}, f"Expected ARM64, got {machine}"'
          python -c 'import sys; print(sys.version); assert sys.version_info[:2] == (3, 13), f"Expected Python 3.13, got {sys.version_info[:2]}"'
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo "Expected native ARM64 runner" >&2; exit 1 ;;
          esac
          python --version

      - name: Install backend requirements
        run: pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall app alembic

      - name: Full backend suite (SQLite)
        run: pytest -q tests

      - name: Upgrade PostgreSQL schema and report current revision
        env:
          DATABASE_URL: postgresql+psycopg://frcaixinha_test:frcaixinha_test@127.0.0.1:5432/frcaixinha_test
          JWT_SECRET: test-only-arm64-secret
          APP_ENV: test
        run: |
          alembic upgrade head
          alembic current | tee /tmp/frcaixinha-alembic-current.txt
          grep -q '0106_event_financial_date_f2e1' /tmp/frcaixinha-alembic-current.txt

      - name: PostgreSQL schema contract
        env:
          DATABASE_URL: postgresql+psycopg://frcaixinha_test:frcaixinha_test@127.0.0.1:5432/frcaixinha_test
          JWT_SECRET: test-only-arm64-secret
          APP_ENV: test
        run: pytest -q tests/test_h4_c8_b3_a377b4r2r2b2f12b_postgresql_schema.py

      - name: PostgreSQL event financial-date migration
        env:
          DATABASE_URL: postgresql+psycopg://frcaixinha_test:frcaixinha_test@127.0.0.1:5432/frcaixinha_test
          JWT_SECRET: test-only-arm64-secret
          APP_ENV: test
        run: pytest -q tests/test_event_financial_date_f2e1_postgresql.py

      - name: PostgreSQL durable cycle scheduler
        env:
          DATABASE_URL: postgresql+psycopg://frcaixinha_test:frcaixinha_test@127.0.0.1:5432/frcaixinha_test
          JWT_SECRET: test-only-arm64-secret
          APP_ENV: test
        run: pytest -q tests/test_worker_cycle_scheduler.py

      - name: PostgreSQL contribution reservation
        env:
          DATABASE_URL: postgresql+psycopg://frcaixinha_test:frcaixinha_test@127.0.0.1:5432/frcaixinha_test
          JWT_SECRET: test-only-arm64-secret
          APP_ENV: test
        run: pytest -q tests/test_a377b4r2r2b2f12d_contribution_pix_reservation.py

      - name: PostgreSQL agreement reservation
        env:
          DATABASE_URL: postgresql+psycopg://frcaixinha_test:frcaixinha_test@127.0.0.1:5432/frcaixinha_test
          JWT_SECRET: test-only-arm64-secret
          APP_ENV: test
        run: pytest -q tests/test_a377b4r2r2b2f12e_agreement_pix_reservation.py

      - name: PostgreSQL webhook orphan replay
        env:
          DATABASE_URL: postgresql+psycopg://frcaixinha_test:frcaixinha_test@127.0.0.1:5432/frcaixinha_test
          JWT_SECRET: test-only-arm64-secret
          APP_ENV: test
        run: pytest -q tests/test_a377b4r2r2b2f12f_webhook_orphan_replay.py

      - name: PostgreSQL payout verification
        env:
          DATABASE_URL: postgresql+psycopg://frcaixinha_test:frcaixinha_test@127.0.0.1:5432/frcaixinha_test
          JWT_SECRET: test-only-arm64-secret
          APP_ENV: test
        run: pytest -q tests/test_h4_c8_b3_a377b4r2r2b2f6_live_postgresql_payout_verification.py

      - name: PostgreSQL encrypted backup and isolated restore
        env:
          DATABASE_URL: postgresql+psycopg://frcaixinha_test:frcaixinha_test@127.0.0.1:5432/frcaixinha_test
          JWT_SECRET: test-only-arm64-secret
          APP_ENV: test
        run: pytest -q tests/test_data_protection_core.py tests/test_data_protection_postgresql.py tests/test_backup_transport.py

      - name: Build backend image natively for ARM64
        run: |
          docker build --pull -t frcaixinha-backend:arm64 .
          image_arch="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' frcaixinha-backend:arm64)"
          echo "Built image architecture: ${image_arch}"
          test "${image_arch}" = "linux/arm64"

      - name: Run backend image command smoke
        run: |
          container_name="frcaixinha-backend-arm64-smoke"
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then
              echo "Backend image smoke failed; container logs follow:" >&2
              docker logs "$container_name" 2>&1 || true
            fi
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            return "$result"
          }
          trap cleanup EXIT

          docker run -d \
            --name "$container_name" \
            -e APP_ENV=test \
            -e DATABASE_URL=sqlite:///./test.db \
            -e JWT_SECRET=ci-only-runtime-smoke-secret \
            frcaixinha-backend:arm64

          sleep 5
          running="$(docker inspect --format '{{.State.Running}}' "$container_name")"
          restart_count="$(docker inspect --format '{{.RestartCount}}' "$container_name")"
          if [ "$running" != "true" ] || [ "$restart_count" != "0" ]; then
            echo "Container did not remain running (running=${running}, restarts=${restart_count})" >&2
            exit 1
          fi

          logs="$(docker logs "$container_name" 2>&1)"
          if printf '%s\n' "$logs" | grep -Fq 'To use the fastapi command, please install "fastapi[standard]"'; then
            echo "Unexpected FastAPI CLI dependency error" >&2
            exit 1
          fi

          docker exec "$container_name" python -c 'import urllib.request; response = urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3); assert response.status == 200, response.status; print("health:", response.status)'
