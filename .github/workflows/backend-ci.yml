name: Backend CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test.db
      JWT_SECRET: testsecret
      APP_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m compileall app alembic
      - run: pytest -q tests

  postgres-payout-verification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frcaixinha_test
          POSTGRES_PASSWORD: frcaixinha_test
          POSTGRES_DB: frcaixinha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frcaixinha_test -d frcaixinha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://frcaixinha_test:frcaixinha_test@127.0.0.1:5432/frcaixinha_test
      JWT_SECRET: test-only-payout-verification-secret
      APP_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m compileall app alembic
      - run: alembic upgrade head
      - run: alembic current
      - run: pytest -q tests/test_h4_c8_b3_a377b4r2r2b2f12b_postgresql_schema.py
      - run: pytest -q tests/test_worker_daily_scheduler.py
      - run: pytest -q tests/test_worker_cycle_scheduler.py
      - run: pytest -q tests/test_a377b4r2r2b2f12d_contribution_pix_reservation.py
      - run: pytest -q tests/test_a377b4r2r2b2f12e_agreement_pix_reservation.py
      - run: pytest -q tests/test_a377b4r2r2b2f12f_webhook_orphan_replay.py
      - run: pytest -q tests/test_h4_c8_b3_a377b4r2r2b2f6_live_postgresql_payout_verification.py

  postgres-backup-restore-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frcaixinha_test
          POSTGRES_PASSWORD: frcaixinha_test
          POSTGRES_DB: frcaixinha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frcaixinha_test -d frcaixinha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://frcaixinha_test:frcaixinha_test@127.0.0.1:5432/frcaixinha_test
      JWT_SECRET: test-only-backup-restore-secret
      APP_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Install pinned age tools
        env:
          GOBIN: ${{ runner.temp }}/age-bin
        run: |
          mkdir -p "$GOBIN"
          go install filippo.io/age/cmd/age@v1.2.1
          go install filippo.io/age/cmd/age-keygen@v1.2.1
          echo "$GOBIN" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      - run: python -m compileall app/data_protection.py app/backup_transport.py tests/test_data_protection_core.py tests/test_data_protection_postgresql.py tests/test_backup_transport.py
      - run: alembic upgrade head
      - run: pytest -q tests/test_data_protection_core.py tests/test_data_protection_postgresql.py tests/test_backup_transport.py tests/test_synthetic_phase_a_drill.py
      - name: Synthetic Phase A backup and isolated restore drill
        run: |
          package_root="$(mktemp -d "$RUNNER_TEMP/frcaixinha-synthetic-packages.XXXXXX")"
          identity_root="$(mktemp -d "$RUNNER_TEMP/frcaixinha-synthetic-identity.XXXXXX")"
          python -m app.synthetic_phase_a_drill --package-root "$package_root" --identity-root "$identity_root"
