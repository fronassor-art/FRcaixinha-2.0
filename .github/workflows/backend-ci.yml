name: Backend CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test.db
      JWT_SECRET: testsecret
      APP_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m compileall app alembic
      - run: pytest -q tests

  postgres-payout-verification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frcaixinha_test
          POSTGRES_PASSWORD: frcaixinha_test
          POSTGRES_DB: frcaixinha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frcaixinha_test -d frcaixinha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://frcaixinha_test:frcaixinha_test@127.0.0.1:5432/frcaixinha_test
      JWT_SECRET: test-only-payout-verification-secret
      APP_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m compileall app alembic
      - run: alembic upgrade head
      - run: alembic current
      - run: pytest -q tests/test_h4_c8_b3_a377b4r2r2b2f12b_postgresql_schema.py
      - run: pytest -q tests/test_worker_daily_scheduler.py
      - run: pytest -q tests/test_worker_cycle_scheduler.py
      - run: pytest -q tests/test_a377b4r2r2b2f12d_contribution_pix_reservation.py
      - run: pytest -q tests/test_a377b4r2r2b2f12e_agreement_pix_reservation.py
      - run: pytest -q tests/test_a377b4r2r2b2f12f_webhook_orphan_replay.py
      - run: pytest -q tests/test_h4_c8_b3_a377b4r2r2b2f6_live_postgresql_payout_verification.py

  postgres-backup-restore-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frcaixinha_test
          POSTGRES_PASSWORD: frcaixinha_test
          POSTGRES_DB: frcaixinha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frcaixinha_test -d frcaixinha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://frcaixinha_test:frcaixinha_test@127.0.0.1:5432/frcaixinha_test
      JWT_SECRET: test-only-backup-restore-secret
      APP_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Install pinned age tools
        env:
          GOBIN: ${{ runner.temp }}/age-bin
        run: |
          mkdir -p "$GOBIN"
          go install filippo.io/age/cmd/age@v1.2.1
          go install filippo.io/age/cmd/age-keygen@v1.2.1
          echo "$GOBIN" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      - run: python -m compileall app/data_protection.py app/backup_transport.py tests/test_data_protection_core.py tests/test_data_protection_postgresql.py tests/test_backup_transport.py
      - run: alembic upgrade head
      - run: pytest -q tests/test_data_protection_core.py tests/test_data_protection_postgresql.py tests/test_backup_transport.py tests/test_synthetic_phase_a_drill.py
      - name: Synthetic Phase A backup and isolated restore drill
        run: |
          set -euo pipefail
          package_root="$(mktemp -d "$RUNNER_TEMP/frcaixinha-synthetic-packages.XXXXXX")"
          identity_root="$(mktemp -d "$RUNNER_TEMP/frcaixinha-synthetic-identity.XXXXXX")"
          publish_root="$(mktemp -d "$RUNNER_TEMP/frcaixinha-synthetic-publication.XXXXXX")"
          test_operator_root="$(mktemp -d "$RUNNER_TEMP/frcaixinha-synthetic-test-operator.XXXXXX")"
          chmod 700 "$package_root" "$identity_root" "$publish_root" "$test_operator_root"
          test_operator_identity="$test_operator_root/test-operator.agekey"
          age-keygen -o "$test_operator_identity" >/dev/null
          chmod 600 "$test_operator_identity"
          test_operator_recipient="$(age-keygen -y "$test_operator_identity")"
          result_file="$RUNNER_TEMP/frcaixinha-synthetic-drill-result.json"
          if ! BACKUP_AGE_OPERATOR_RECIPIENT="$test_operator_recipient" \
            python -m app.synthetic_phase_a_drill \
              --package-root "$package_root" \
              --identity-root "$identity_root" \
              --publish-root "$publish_root" \
              --require-operator-recipient > "$result_file"; then
            python -c 'import json,sys; print(json.load(open(sys.argv[1]))["error_code"])' "$result_file"
            exit 1
          fi
          python - "$result_file" "$publish_root" "$identity_root" <<'PY'
          import json
          import pathlib
          import sys

          result_path, publish_root, identity_root = map(pathlib.Path, sys.argv[1:])
          result = json.loads(result_path.read_text())
          publish = publish_root.resolve(strict=True)
          identities = identity_root.resolve(strict=True)
          identity = pathlib.Path(result["identity_path"]).resolve(strict=True)
          envelope = pathlib.Path(result["publish_envelope_path"]).resolve(strict=True)
          receipt = pathlib.Path(result["receipt_path"]).resolve(strict=True)
          assert result["status"] == "PASS"
          assert identity.parent == identities and identity.stat().st_mode & 0o077 == 0
          assert envelope.parent == publish and receipt.parent == publish
          print("Synthetic multi-recipient backup, envelope restore, and integrity: PASS")
          print(f"backup_id={result['backup_id']}")
          print(f"envelope_sha256={result['package_sha256']}")
          PY
