groups:
  - name: frcaixinha-operational
    rules:
      - alert: FRcaixinhaApiDown
        expr: up{job="frcaixinha-api"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "API do FRcaixinha indisponível"
          runbook: "Verificar container da API e /health/ready"
      - alert: FRcaixinhaHighErrorRate
        expr: sum(rate(frcaixinha_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(frcaixinha_http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Taxa de erro HTTP acima de 5%"
      - alert: FRcaixinhaHighLatency
        expr: histogram_quantile(0.95, sum(rate(frcaixinha_http_request_duration_seconds_bucket[5m])) by (le)) > 1.5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "P95 da API acima de 1,5s"
      - alert: FRcaixinhaWorkerStale
        expr: time() - frcaixinha_worker_heartbeat_timestamp_seconds{job="frcaixinha-worker"} > 180
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "Worker do FRcaixinha sem heartbeat"
      - alert: FRcaixinhaWorkerMetricsDown
        expr: up{job="frcaixinha-worker"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Endpoint de métricas do worker indisponível"
      - alert: FRcaixinhaSchedulerRunFailed
        expr: frcaixinha_scheduler_runs_failed > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Existe SchedulerRun FAILED"
      - alert: FRcaixinhaSchedulerLeaseExpired
        expr: frcaixinha_scheduler_runs_expired_lease > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Existe SchedulerRun RUNNING com lease expirada"
      - alert: FRcaixinhaSchedulerRunPending
        expr: frcaixinha_scheduler_runs_pending > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Existe SchedulerRun PENDING por mais de cinco minutos"
      - alert: FRcaixinhaSchedulerMetricsDatabaseDown
        expr: frcaixinha_scheduler_metrics_database_up == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Métricas de SchedulerRun não conseguiram consultar PostgreSQL"
      - alert: FRcaixinhaSchedulerJobNeverSucceeded
        # A worker may start just after a slot. The next daily slot is less
        # than 24h away; 6h extra matches the established operational grace.
        expr: (frcaixinha_scheduler_runs_last_succeeded_timestamp_seconds{job="frcaixinha-api",job_key=~"worker_daily_tasks|worker_cycle_participation_daily"} == 0) and on() (time() - frcaixinha_worker_process_start_timestamp_seconds{job="frcaixinha-worker"} > 108000) and on() (frcaixinha_scheduler_metrics_database_up{job="frcaixinha-api"} == 1) and on() (up{job="frcaixinha-worker"} == 1)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Job do scheduler nunca concluiu uma run SUCCEEDED"
          description: "Não há sucesso durável após a primeira oportunidade diária (intervalo <24h) mais 6h de tolerância operacional. O heartbeat confirma somente que o loop está vivo."
      - alert: FRcaixinhaSchedulerJobNoRecentSuccess
        expr: (frcaixinha_scheduler_runs_last_succeeded_timestamp_seconds{job="frcaixinha-api"} > 0) and on(job_key) (time() - frcaixinha_scheduler_runs_last_succeeded_timestamp_seconds{job="frcaixinha-api"} > 108000) and on() (frcaixinha_scheduler_metrics_database_up{job="frcaixinha-api"} == 1)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Job diário sem SUCCEEDED por mais de 30 horas"
          description: "Janela de 30h = intervalo diário de 24h + 6h de tolerância operacional; alerta só após o primeiro SUCCEEDED."
      - alert: FRcaixinhaOverdueInstallments
        expr: frcaixinha_installments_overdue > 0
        for: 15m
        labels: {severity: info}
        annotations:
          summary: "Existem parcelas vencidas"
